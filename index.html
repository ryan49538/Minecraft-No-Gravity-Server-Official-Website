<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>無重力空間伺服器官方網站</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            color: #f8fafc;
            min-height: 100vh;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glow-btn {
            transition: all 0.3s ease;
        }
        .glow-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(129, 140, 248, 0.5);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header class="py-10 px-4 text-center">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400 mb-6">
                無重力空間伺服器官方網站
            </h1>
            <p class="text-slate-300 text-base md:text-lg max-w-2xl mx-auto">
                歡迎來到無重力空間！探索我們的伺服器資源、模組、檔案與最新動態。
            </p>
        </div>
    </header>

    <main class="flex-grow max-w-5xl w-full mx-auto px-4 py-6 space-y-12">
        <!-- Section 1: Quick Access (快速存取) -->
        <section class="glass-panel rounded-3xl p-6 md:p-8 shadow-2xl">
            <h2 class="text-xl font-bold text-indigo-200 mb-6 flex items-center gap-2">
                <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                快速存取
            </h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                <button onclick="openModal('伺服器加入資訊')" class="glow-btn flex items-center justify-center gap-3 p-4 bg-indigo-600/30 hover:bg-indigo-600/50 border border-indigo-500/40 rounded-2xl text-white font-medium">
                    <span>🚀</span> 伺服器加入資訊
                </button>
                <a href="https://drive.google.com/uc?export=download&id=1BS4S9HbUB9RlTNyQZ8Jei1QevE7o1h4r" target="_blank" rel="noopener noreferrer" class="glow-btn flex items-center justify-center gap-3 p-4 bg-purple-600/30 hover:bg-purple-600/50 border border-purple-500/40 rounded-2xl text-white font-medium">
                    <span>💾</span> 伺服器存檔
                </a>
                <a href="https://drive.google.com/file/d/1rOVjz5Y_KiZvNfWrQdiWTL4BusIkf_jG/view?usp=drivesdk" target="_blank" rel="noopener noreferrer" class="glow-btn flex items-center justify-center gap-3 p-4 bg-pink-600/30 hover:bg-pink-600/50 border border-pink-500/40 rounded-2xl text-white font-medium">
                    <span>🧩</span> 伺服器模組
                </a>
                <a href="https://drive.google.com/uc?export=download&id=1rOVjz5Y_KiZvNfWrQdiWTL4BusIkf_jG" target="_blank" rel="noopener noreferrer" class="glow-btn flex items-center justify-center gap-3 p-4 bg-blue-600/30 hover:bg-blue-600/50 border border-blue-500/40 rounded-2xl text-white font-medium">
                    <span>🎨</span> 伺服器資源包
                </a>
                <button onclick="openModal('伺服器內容檔案')" class="glow-btn flex items-center justify-center gap-3 p-4 bg-violet-600/30 hover:bg-violet-600/50 border border-violet-500/40 rounded-2xl text-white font-medium sm:col-span-2 md:col-span-1">
                    <span>📂</span> 伺服器內容檔案
                </button>
            </div>
        </section>

        <!-- Section 2: External Links Table (外部連結區) -->
        <section class="glass-panel rounded-3xl p-6 md:p-8 shadow-2xl">
            <h2 class="text-xl font-bold text-indigo-200 mb-6 flex items-center gap-2">
                <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                外部連結區
            </h2>
            <div class="overflow-x-auto rounded-xl border border-slate-700/50">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-800/60 text-slate-300 text-sm uppercase tracking-wider border-b border-slate-700/50">
                            <th class="py-4 px-6 font-semibold">服務名稱</th>
                            <th class="py-4 px-6 font-semibold">說明 / 用途</th>
                            <th class="py-4 px-6 font-semibold text-right">操作</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-700/30 text-slate-200">
                        <tr class="hover:bg-slate-800/30 transition-colors">
                            <td class="py-4 px-6 font-medium text-indigo-300">回報錯誤</td>
                            <td class="py-4 px-6 text-slate-400 text-sm">遇到伺服器Bug或異常問題時請在此回報</td>
                            <td class="py-4 px-6 text-right">
                                <a href="https://forms.gle/WM1hZ1xu9uPTih6o8" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 px-4 py-2 bg-indigo-500 hover:bg-indigo-600 text-white text-sm font-medium rounded-xl shadow-lg transition-all">
                                    前往連結 <span class="text-xs">↗</span>
                                </a>
                            </td>
                        </tr>
                        <tr class="hover:bg-slate-800/30 transition-colors">
                            <td class="py-4 px-6 font-medium text-indigo-300">車站查詢系統</td>
                            <td class="py-4 px-6 text-slate-400 text-sm">查詢伺服器內部鐵路與車站路線網路</td>
                            <td class="py-4 px-6 text-right">
                                <a href="https://ryan49538.github.io/Minecraft-No-gravity-server-Station-Inquiry-System/" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 px-4 py-2 bg-indigo-500 hover:bg-indigo-600 text-white text-sm font-medium rounded-xl shadow-lg transition-all">
                                    前往連結 <span class="text-xs">↗</span>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Section 3: News/Information (伺服器情報電子檔) -->
        <section class="glass-panel rounded-3xl p-6 md:p-8 shadow-2xl">
            <h2 class="text-xl font-bold text-indigo-200 mb-6 flex items-center gap-2">
                <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path></svg>
                伺服器情報電子檔
            </h2>
            <div class="bg-slate-900/50 rounded-2xl border border-slate-800 p-8 text-center text-slate-400">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-slate-800 text-slate-500 mb-3 text-xl">
                    📭
                </div>
                <p class="text-lg font-medium text-slate-300">暫無資料</p>
                <p class="text-xs text-slate-500 mt-1">請期待未來的伺服器情報與最新公告發布。</p>
            </div>
        </section>
    </main>

    <footer class="py-6 text-center text-xs text-slate-500 border-t border-slate-800/80 mt-12">
        <p>© 無重力空間伺服器官方網站 All Rights Reserved.</p>
    </footer>

    <!-- Custom Modal for button info feedback -->
    <div id="infoModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="glass-panel bg-slate-900/90 border border-slate-700 rounded-3xl p-6 max-w-md w-full mx-4 shadow-2xl transform scale-95 transition-transform duration-300" id="modalContainer">
            <h3 id="modalTitle" class="text-xl font-bold text-white mb-2">提示</h3>
            <p id="modalDesc" class="text-slate-300 text-sm mb-6">內容加載中...</p>
            <div class="flex justify-end">
                <button onclick="closeModal()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-medium text-sm transition-all shadow-lg">
                    確定
                </button>
            </div>
        </div>
    </div>

    <script>
        function openModal(title) {
            const modal = document.getElementById('infoModal');
            const container = document.getElementById('modalContainer');
            const titleEl = document.getElementById('modalTitle');
            const descEl = document.getElementById('modalDesc');

            titleEl.textContent = title;
            
            if (title === '伺服器加入資訊') {
                descEl.innerHTML = `IP：nogravity.mcsv.tw<br>Version：Java 26.2`;
            } else if (title === '伺服器內容檔案') {
                descEl.innerHTML = `請更改server.properties<br>資源包請自行上傳<br><br><pre class="bg-slate-950 p-3 rounded-xl text-xs overflow-x-auto text-indigo-200 text-left font-mono max-h-60">accepts-transfers=false
allow-flight=true
broadcast-console-to-ops=true
broadcast-rcon-to-ops=true
bug-report-link=https\\://forms.gle/WM1hZ1xu9uPTih6o8
chat-spam-threshold-seconds=10
command-spam-threshold-seconds=10
difficulty=easy
enable-code-of-conduct=false
enable-jmx-monitoring=false
enable-query=false
enable-rcon=false
enable-status=true
enforce-secure-profile=true
enforce-whitelist=true
entity-broadcast-range-percentage=100
force-gamemode=false
function-permission-level=2
gamemode=survival
generate-structures=true
generator-settings={}
hardcore=false
hide-online-players=false
initial-disabled-packs=
initial-enabled-packs=vanilla
level-name=world
level-seed=8011042041380838277
level-type=minecraft\\:normal
log-ips=true
management-server-allowed-origins=
management-server-host=localhost
rcon.password=
rcon.port=25575
region-file-compression=deflate
require-resource-pack=true
resource-pack=
resource-pack-id=
resource-pack-prompt=
resource-pack-sha1=
server-ip=0.0.0.0
server-port=12250
simulation-distance=10
spawn-protection=0
status-heartbeat-interval=0
sync-chunk-writes=true
text-filtering-config=
text-filtering-version=0
use-native-transport=true
view-distance=32
white-list=true</pre>`;
            } else {
                descEl.textContent = `您點擊了「${title}」。`;
            }

            modal.classList.remove('opacity-0', 'pointer-events-none');
            container.classList.remove('scale-95');
            container.classList.add('scale-100');
        }

        function closeModal() {
            const modal = document.getElementById('infoModal');
            const container = document.getElementById('modalContainer');

            modal.classList.add('opacity-0', 'pointer-events-none');
            container.classList.remove('scale-100');
            container.classList.add('scale-95');
        }

        function handleLinkClick(event, name) {
            event.preventDefault();
            openModal(name);
        }
    </script>
</body>
</html>
